<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Home</title>
</head>
<body>
    
<main class="tela-login"> 
    <h1 class="titulo-principal">Pop Boutique</h1>
    <h3 class="subtitulo">Seu look ideal está a apenas uma conversa de distância.</h3>

    <div class="caixa-formulario">
        <h4 class="texto-login">Seja bem-vindo(a)! Faça login para acessar sua conta.</h4>
        <form action="principal.html" class="formulario-login">

        <label class="campo">E-mail:</label>
        <input type="email" placeholder="Digite seu e-mail" class="entrada-dados">
        
        <label class="campo">Senha:</label>
        <input type="password" placeholder="Digite sua senha" class="entrada-dados">
       
        <button class="login-botao">Entrar</button>
        </form>
    </div>
</main>

<footer class="rodape-login">
    <p>&copy; 2026 Pop Boutique - Projeto Acadêmico</p> 
</footer>

</body>
</html>
